<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>お問い合わせ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="header-inner">

            <div class="logo">
                <img src ="images/logo会社.png" >
                <div>
                  <div></div>
                
                <div class="company-subtitle">Customer Support</div>
                </div>
            </div>

            <nav class="nav">
     <!-- them chuc nang  duong link dan den o de muc -->>
                <a href="#">ホーム</a>
                <a href="#">サービス</a>
                <a href="#">サポート</a>
                <a href="https://globalnet-ailes.com/work-system" target="_blank">会社情報</a> 
                <a href="#" class="active">お問い合わせ</a>
            </nav>

        </div>

    </header>


    <!-- Hero -->
    <section class="hero">

        <div class="hero-content">

            <p class="hero-label">CUSTOMER SUPPORT</p>

            <h1>お問い合わせ</h1>

            <p>
                ご質問・ご相談などございましたら、<br>
                以下のフォームよりお気軽にお問い合わせください。
            </p>

        </div>

    </section>


    <!-- Main -->
    <main class="main">

        <div class="form-card">

            <div class="form-header">

                <h2>お問い合わせフォーム</h2>

                <p>
                    必要事項をご入力のうえ、送信してください。
                </p>

                <p class="required-text">
                    <span>*</span> 必須項目
                </p>

            </div>


            <form>

                <!-- 会社名 -->
                <div class="form-group">

                    <label for="companyName">
                        会社名
                        <span class="required">必須</span>
                    </label>

                    <input
                        type="text"
                        id="companyName"
                        placeholder="例）株式会社〇〇"
                    >

                </div>


                <!-- 名前 -->
                <div class="form-group">

                    <label for="name">
                        お名前
                        <span class="required">必須</span>
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="例）山田 太郎"
                    >

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        メールアドレス
                        <span class="required">必須</span>
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="例）example@company.co.jp"
                    >

                </div>


                <!-- 問い合わせ種類 -->
                <div class="form-group">

                    <label for="category">
                        お問い合わせ種別
                        <span class="required">必須</span>
                    </label>

                    <select id="category">

                        <option value="">
                            選択してください
                        </option>

                        <option value="product">
                            製品について
                        </option>

                        <option value="service">
                            サービスについて
                        </option>

                        <option value="error">
                            システムエラーについて
                        </option>

                        <option value="operation">
                            操作方法について
                        </option>

                        <option value="other">
                            その他
                        </option>

                    </select>

                </div>


                <!-- 件名 -->
                <div class="form-group">

                    <label for="subject">
                        件名
                        <span class="required">必須</span>
                    </label>

                    <input
                        type="text"
                        id="subject"
                        placeholder="例）システムエラーについて"
                    >

                </div>


                <!-- 内容 -->
                <div class="form-group">

                    <label for="message">
                        お問い合わせ内容
                        <span class="required">必須</span>
                    </label>

                    <textarea
                        id="message"
                        placeholder="お問い合わせ内容をご入力ください。"
                    ></textarea>

                </div>


                <!-- Button -->
                <div class="button-area">

                    <button
                        type="button"
                        id="submitButton"
                    >
                        送信する
                    </button>

                </div>

            </form>

        </div>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <div class="footer-inner">

            <div>
                <strong>株式会社　Globalnet Alies</strong>
                <p>Customer Support</p>
            </div>

            <div class="footer-links">
                <a href="#">プライバシーポリシー</a>
                <a href="#">利用規約</a>
                <a href="#">サイトマップ</a>
            </div>

            <div class="copyright">
                © 2026 株式会社　Globalnet Alies
            </div>

        </div>

    </footer>


    <script src="script.js"></script>

</body>

</html>
