<!DOCTYPE html>   <!--khai báo dữ liệu HTML5-->

<html lang="ja">  <!--thẻ gốc của trang  
lang="ja" = nội dung chính là tiếng Nhật.-->





<head>
<!--Chứa thông tin cấu hình của trang, không phải nội dung chính hiển thị cho người dùng.-->


    <meta charset="UTF-8">
<!--Thiết lập bộ mã ký tự UTF-8 để hiển thị tiếng Nhật, Kanji, tiếng Việt...>-->



    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--Làm website hiển thị phù hợp trên điện thoại/tablet.-->



    <title>お問い合わせ</title> 
<!--Tên hiển thị trên tab trình duyệt.-->


    <link rel="stylesheet" href="style.css">
    <!--kết nối HTML với file CSS là cái này-->

</head>
<!--phần trên đây là head-->




<body>
    <!--body chứa toàn bộ nội dung mà khách thấy-->

   
    <header class="header">
         <!-- Header  phần đầu website-->

        <div class="header-inner">
             <!--VD <div class = "header-inner">
                div là 1 khối chứa  
                class = "header-inner" la de CSS xac dinh khoi nay -->






            <div class="logo">
                <!--khoi chua logo-->

                <img src ="images/logo会社.png">
                <!--hien thi hinh anh-->
                <!--src = source    duong dan den hinh anh  -->

                <div>  <!--dong khoi lai-->


                  <div></div> <!--tao khoang trong de de nhin--> 






                
                <div class="company-subtitle">Customer Support</div>
                </div>  <!--mot khoi khac tuogn tu de css nhin ra-->
        </div>








            <nav class="nav">
                <!--< nav = navigation =khu vuc dieu huong website>-->


                <a href="https://globalnet-ailes.com/company"target="_blank">ホーム</a>
                <!--<a> = anchor= dung de tao link lien ket-->
                <!--href = dia chi ma link se di den -->
                <!--bam vao ホーム -> di den duogn link cong ty tren kia-->
                
                <!-- khi muon them gi thi vao day   
                a href="#">サービス</a>
                <a href="#">サポート</a>-->
                <!--da ghi chu de phan nay nheeeeeeeeeeeeeeeeee--> 

                <a href="https://globalnet-ailes.com/work-system" target="_blank">システム部</a> 
                <a href="#" class="active">お問い合わせ</a>
            </nav>   

        </div>

    </header>


    <!-- Hero -->
    <section class="hero">

        <div class="hero-content">

            <p class="hero-label">CUSTOMER SUPPORT</p>

            <h1>お問い合わせ</h1>

            <p>
                ご質問・ご相談などございましたら、<br>
                以下のフォームよりお気軽にお問い合わせください。
            </p>

        </div>

    </section>


    <!-- Main -->
    <main class="main">

        <div class="form-card">

            <div class="form-header">

                <h2>お問い合わせフォーム</h2>

                <p>
                    必要事項をご入力のうえ、送信してください。
                </p>

                <p class="required-text">
                    <span>*</span> 必須項目
                </p>

            </div>


            <form>

                <!-- 会社名 -->
                <div class="form-group">

                    <label for="companyName">
                        会社名
                        <span class="required">必須</span>
                    </label>

                    <input
                        type="text"
                        id="companyName"
                        placeholder="例）株式会社〇〇"
                    >

                </div>


                <!-- 名前 -->
                <div class="form-group">

                    <label for="name">
                        お名前
                        <span class="required">必須</span>
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="例）山田 太郎"
                    >

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        メールアドレス
                        <span class="required">必須</span>
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="例）example@company.co.jp"
                    >

                </div>


                <!-- 問い合わせ種類 -->
                <div class="form-group">

                    <label for="category">
                        お問い合わせ種別
                        <span class="required">必須</span>
                    </label>

                    <select id="category">

                        <option value="">
                            選択してください
                        </option>

                        <option value="product">
                            製品について
                        </option>

                        <option value="service">
                            サービスについて
                        </option>

                        <option value="error">
                            システムエラーについて
                        </option>

                        <option value="operation">
                            操作方法について
                        </option>

                        <option value="other">
                            その他
                        </option>

                    </select>

                </div>


                <!-- 件名 -->
                <div class="form-group">

                    <label for="subject">
                        件名
                        <span class="required">必須</span>
                    </label>

                    <input
                        type="text"
                        id="subject"
                        placeholder="例）システムエラーについて"
                    >

                </div>

<!-- 添付ファイル -->
<div class="form-group">

    <label>
        添付ファイル
    </label>

    <div class="attachment-area">

        <label for="attachment" class="attachment-plus">
            ＋
        </label>

   
        <div id="dropZone" class="drop-zone">
            ファイルをここにドラッグ＆ドロップ
        </div>

    </div>

    <input
        type="file"
        id="attachment"
        name="attachment"
        accept=".jpg,.jpeg,.png,.webp,.pdf,.xlsx,.xls,.csv,.docx"
        multiple 
        hidden
    >

    <p id="fileName"></p>

 
</div>

        <!-- 内容 -->
        <div class="form-group">

        <label for="message">
            お問い合わせ内容
            <span class="required">必須</span>
        </label>

        <textarea
            id="message"
            placeholder="お問い合わせ内容をご入力ください。"
        ></textarea>

    </div>
                    <!-- Button -->
                    <div class="button-area">

                        <button
                            type="button"
                            id="submitButton"
                        >
                            送信する
                        </button>

                    </div>

                </form>

            </div>

        </main>


        <!-- Footer -->
        <footer class="footer">

            <div class="footer-inner">

                <div>
                    <strong>株式会社　Globalnet Alies</strong>
                    <p>Customer Support</p>
                </div>

                <div class="footer-links">
                    <a href="#">プライバシーポリシー</a>
                    <a href="#">利用規約</a>
                    <a href="#">サイトマップ</a>
                </div>

                <div class="copyright">
                    © 2026 株式会社　Globalnet Alies
                </div>

            </div>

        </footer>


        <script src="script.js"></script>

    </body>

    </html>
